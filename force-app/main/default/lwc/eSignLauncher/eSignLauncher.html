<template>
    <lightning-card title="Send for Signature" icon-name="utility:signature">

        <template if:true={isSuccess}>
            <div class="slds-p-around_medium slds-theme_success slds-theme_alert-texture">
                <lightning-icon icon-name="utility:success" size="small" class="slds-m-right_x-small"></lightning-icon>
                <strong>Signing request sent!</strong>
                &nbsp;A signing link has been emailed to <strong>{recipientEmail}</strong>.
                <div class="slds-m-top_x-small" style="font-size:12px;color:#2e844a">
                    Request ref: {result.signatureRequestName}
                </div>
            </div>
        </template>

        <template if:false={isSuccess}>
            <div class="slds-p-around_medium">

                <!-- Recipient Email -->
                <lightning-input
                    type="email"
                    label="Recipient Email"
                    value={recipientEmail}
                    onchange={handleChange}
                    data-field="recipientEmail"
                    required
                    class="slds-m-bottom_small">
                </lightning-input>

                <!-- Recipient Name -->
                <lightning-input
                    type="text"
                    label="Recipient Name"
                    value={recipientName}
                    onchange={handleChange}
                    data-field="recipientName"
                    class="slds-m-bottom_small">
                </lightning-input>

                <!-- Expiry -->
                <lightning-input
                    type="number"
                    label="Link Expiry (hours)"
                    value={expiryHours}
                    min="1"
                    max="720"
                    onchange={handleChange}
                    data-field="expiryHours"
                    class="slds-m-bottom_small">
                </lightning-input>

                <!-- Message to Signer -->
                <lightning-textarea
                    label="Message to Signer (optional)"
                    value={messageToSigner}
                    onchange={handleChange}
                    data-field="messageToSigner"
                    max-length="500"
                    class="slds-m-bottom_medium">
                </lightning-textarea>

                <!-- Document Info Banner -->
                <template if:true={contentDocumentId}>
                    <div class="esign-doc-banner">
                        <lightning-icon icon-name="doctype:pdf" size="small"
                            class="slds-m-right_x-small"></lightning-icon>
                        Document loaded &bull;
                        <span class="slds-truncate" title={contentDocumentId}>
                            ID: {contentDocumentId}
                        </span>
                    </div>
                </template>

                <!-- Error -->
                <template if:true={errorMessage}>
                    <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_small"
                         role="alert">
                        <span>{errorMessage}</span>
                    </div>
                </template>

                <!-- Actions -->
                <div class="slds-grid slds-gutters_x-small slds-m-top_medium">
                    <div class="slds-col">
                        <lightning-button
                            label={sendLabel}
                            variant="brand"
                            onclick={handleSend}
                            disabled={isSendDisabled}
                            class="slds-m-right_small">
                        </lightning-button>
                        <lightning-button
                            label="Cancel"
                            variant="neutral"
                            onclick={handleCancel}>
                        </lightning-button>
                    </div>
                </div>

            </div>
        </template>

        <template if:true={isLoading}>
            <lightning-spinner
                alternative-text="Sending..."
                size="medium">
            </lightning-spinner>
        </template>

    </lightning-card>
</template>
